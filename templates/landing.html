<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DR Screening System - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f8ceec, #a88beb);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .landing-card {
            background: white;
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 600px;
        }
        .landing-card h1 {
            color: #2d0a49;
            margin-bottom: 20px;
        }
        .btn-custom {
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 30px;
            margin: 10px;
            min-width: 200px;
        }
        .btn-patient {
            background: #a88beb;
            color: white;
            border: none;
        }
        .btn-patient:hover {
            background: #2d0a49;
        }
        .btn-doctor {
            background: #f8ceec;
            color: #2d0a49;
            border: 2px solid #a88beb;
        }
        .btn-doctor:hover {
            background: #a88beb;
            color: white;
        }
    </style>
</head>
<body>
    <div class="landing-card">
        <h1>🩺 Diabetic Retinopathy Screening System</h1>
        <p class="lead mb-4">AI-Powered Early Detection for Better Eye Health</p>
        
        <div class="mt-5">
            <h4 class="mb-3">I am a:</h4>
            <a href="/login" class="btn btn-custom btn-patient">
                👤 Patient
            </a>
            <a href="/doctor-login" class="btn btn-custom btn-doctor">
                👨‍⚕️ Doctor
            </a>
        </div>
        
        <div class="mt-5">
            <small class="text-muted">
                Patients: View your screening history<br>
                Doctors: Manage all patient records
            </small>
        </div>
    </div>
</body>
</html>
