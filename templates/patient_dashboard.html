<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Screening History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #a88beb;
            --secondary: #f8ceec;
            --dark: #2d0a49;
        }
        body {
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        .navbar {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .severity-0 { background: #28a745; color: white; }
        .severity-1 { background: #ffc107; color: white; }
        .severity-2 { background: #ff9800; color: white; }
        .severity-3 { background: #f44336; color: white; }
        .severity-4 { background: #9c27b0; color: white; }
        .severity-badge {
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
        }
        .btn-primary {
            background: var(--primary);
            border: none;
        }
        .btn-primary:hover {
            background: var(--dark);
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <div class="navbar">
        <div class="row align-items-center">
            <div class="col-md-8">
                <h3><i class="fas fa-user-circle"></i> Welcome, <span id="patientName"></span></h3>
                <p class="text-muted mb-0">Patient ID: <span id="patientId"></span></p>
            </div>
            <div class="col-md-4 text-end">
                <a href="/logout" class="btn btn-outline-danger">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </a>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- Upload New Screening -->
        <div class="card p-4 mb-4">
            <h4><i class="fas fa-camera"></i> Upload New Retinal Scan</h4>
            <form id="uploadForm">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label>Select Eye</label>
                        <select class="form-control" name="eye_side">
                            <option value="Right">Right Eye</option>
                            <option value="Left">Left Eye</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label>Upload Image</label>
                        <input type="file" class="form-control" name="file" accept="image/*" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-upload"></i> Upload & Analyze
                </button>
            </form>
            <div id="uploadResult" class="mt-3" style="display:none;"></div>
        </div>

        <!-- Screening History -->
        <div class="card p-4">
            <h4><i class="fas fa-history"></i> My Screening History</h4>
            <div id="screeningsContainer">
                <p class="text-center">Loading...</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_URL = 'http://localhost:5000/api';
        
        // Load Profile
        async function loadProfile() {
            try {
                const response = await fetch(`${API_URL}/patient/profile`);
                const patient = await response.json();
                
                document.getElementById('patientName').textContent = patient.name;
                document.getElementById('patientId').textContent = patient.patient_id;
            } catch (error) {
                console.error('Error loading profile:', error);
            }
        }
        
        // Load Screenings
        async function loadScreenings() {
            try {
                const response = await fetch(`${API_URL}/patient/screenings`);
                const screenings = await response.json();
                
                const container = document.getElementById('screeningsContainer');
                
                if (screenings.length === 0) {
                    container.innerHTML = '<p class="text-center text-muted">No screenings yet. Upload your first retinal scan!</p>';
                    return;
                }
                
                container.innerHTML = screenings.map(s => `
                    <div class="card mb-3 p-3">
                        <div class="row align-items-center">
                            <div class="col-md-8">
                                <h6>${new Date(s.screening_date).toLocaleDateString('en-US', {
                                    year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit'
                                })}</h6>
                                <span class="severity-badge severity-${s.severity_level}">
                                    ${s.prediction}
                                </span>
                                <p class="mt-2 mb-0">
                                    <strong>Eye:</strong> ${s.eye_side} | 
                                    <strong>Confidence:</strong> ${s.confidence.toFixed(2)}%
                                </p>
                                ${s.requires_referral ? '<p class="text-danger mb-0">⚠️ Referral recommended</p>' : ''}
                            </div>
                            <div class="col-md-4 text-end">
                                <button class="btn btn-sm btn-primary" onclick="downloadReport('${s.screening_id}')">
                                    <i class="fas fa-download"></i> Download Report
                                </button>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading screenings:', error);
            }
        }
        
        // Upload Screening
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const resultDiv = document.getElementById('uploadResult');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '<div class="spinner-border"></div> Analyzing your image...';
            
            const formData = new FormData(e.target);
            
            try {
                const response = await fetch(`${API_URL}/patient/screening/upload`, {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (result.success) {
                    const probHtml = Object.entries(result.probabilities).map(([cls, prob]) => 
                        `<li>${cls}: ${(prob * 100).toFixed(2)}%</li>`
                    ).join('');
                    
                    resultDiv.innerHTML = `
                        <div class="alert alert-success">
                            <h5>Analysis Complete!</h5>
                            <span class="severity-badge severity-${result.severity_level}">
                                ${result.prediction}
                            </span>
                            <p class="mt-2"><strong>Confidence:</strong> ${result.confidence.toFixed(2)}%</p>
                            <ul class="mb-0">${probHtml}</ul>
                            ${result.requires_referral ? '<p class="text-danger mt-2">⚠️ We recommend consulting an ophthalmologist</p>' : ''}
                        </div>
                    `;
                    
                    e.target.reset();
                    setTimeout(() => loadScreenings(), 1000);
                } else {
                    resultDiv.innerHTML = `<div class="alert alert-danger">Error: ${result.error}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="alert alert-danger">Error: ${error.message}</div>`;
            }
        });
        
        // Download Report
        function downloadReport(screeningId) {
            window.open(`${API_URL}/patient/screening/${screeningId}/report`, '_blank');
        }
        
        // Load data on page load
        loadProfile();
        loadScreenings();
    </script>
</body>
</html>
